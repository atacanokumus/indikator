name: Video Sync & Analysis

on:
  schedule:
    # Günde 3 kez çalış (UTC saatleri)
    - cron: '0 6 * * *'   # 09:00 TR
    - cron: '0 12 * * *'  # 15:00 TR
    - cron: '0 19 * * *'  # 22:00 TR
  workflow_dispatch: # Manuel tetikleme butonu

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 30 dakikaya kadar çalışabilir (Vercel'in 60 saniyesine karşı!)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run video sync
        run: npx tsx src/cron.ts --once
        env:
          # Firebase Config
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          # API Keys
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_COOKIE: ${{ secrets.YOUTUBE_COOKIE }}
