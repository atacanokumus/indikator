name: Yedek Tarama ve Bakım

# Anlık bildirim (push) birincil yöntemdir; bu iş akışı güvenlik ağıdır:
# push kaçarsa veya abonelik düşerse videoları yine de yakalar.
#
# NOT: Depo GİZLİ ise GitHub Actions ayda 2000 dakika ücretsizdir. Bu yüzden
# tarama sıklığı bilinçli olarak düşük tutuluyor (12 saatte bir + günlük
# derin tarama). Depoyu HERKESE AÇIK yaparsanız dakika sınırı kalkar ve
# aralığı daha sık yapabilirsiniz.
#
# Fiyat güncelleme burada DEĞİL — GitHub Actions dakikasından bağımsız,
# ayrı bir Vercel Cron ile /api/sync/prices üzerinden yapılıyor (bkz.
# vercel.json + src/server/price-sync.ts). Böylece Actions dakikası
# tükense bile site fiyatları güncel kalmaya devam ediyor.
on:
  schedule:
    - cron: "15 */12 * * *"  # 12 saatte bir: kaçan video kontrolü
    - cron: "20 3 * * *"     # her gün 06:20 TR: derin tarama + abonelik yenileme
  workflow_dispatch:
    inputs:
      deep:
        description: "Derin tarama yap"
        type: boolean
        default: false

concurrency:
  group: analistnediyor-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      WEBSUB_SECRET: ${{ secrets.WEBSUB_SECRET }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      IS_DEEP: ${{ (github.event.schedule == '20 3 * * *' || inputs.deep) && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: node_modules önbelleği
        id: nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci

      # ÖNEMLİ: Abonelik yenileme taramadan ÖNCE ve HER turda.
      #  - Eskiden en sondaydı: tarama 30 dakikalık iş sınırına takılırsa
      #    abonelikler hiç yenilenmiyor, anlık güncelleme sessizce ölüyordu.
      #  - Eskiden yalnızca derin taramada (günde bir) çalışıyordu: Google'ın
      #    hub'ı saatlerce 503 döndürebiliyor ve o gün yenileme tamamen
      #    kaçıyordu. Artık 12 saatte bir deneniyor; abonelikler ~5 gün
      #    dayandığı için bu hâlâ rahat bir emniyet payı.
      # Hata yenilemeyi durdurmasın; tarama yine de çalışsın.
      - name: Push aboneliklerini yenile
        continue-on-error: true
        run: npx tsx src/scripts/resubscribe.ts

      - name: Kanalları tara
        run: |
          if [ "$IS_DEEP" = "yes" ]; then
            npx tsx src/scripts/scan-all.ts --deep
          else
            npx tsx src/scripts/scan-all.ts
          fi
